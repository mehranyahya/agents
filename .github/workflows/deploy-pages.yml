name: Deploy Vite app to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate slide content and presentation controls
        run: npm run check:presentation

      - name: Test keyboard shortcuts after interactive demo
        run: npm run test:keyboard

      - name: Type-check TypeScript
        run: npm run lint

      - name: Build
        run: npm run build -- --base=/agents/

      - name: Visual audit for classroom projection (PR only)
        if: github.event_name == 'pull_request'
        run: |
          npm install --no-save playwright
          node scripts/audit-projector.mjs

      - name: Upload projector snapshots (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: projector-snapshots
          path: projector-snapshots/
          if-no-files-found: warn

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
